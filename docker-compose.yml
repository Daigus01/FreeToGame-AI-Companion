# STATUS: written, NOT yet run (TODO P1-01). Requires Docker.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: ftg, POSTGRES_PASSWORD: ftg, POSTGRES_DB: ftg }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro   # 001 + 002 run on first init only
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ftg:ftg@postgres:5432/ftg
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    command: sh -c "npm install && npm run dev"
    depends_on: [backend]
volumes:
  pgdata:
